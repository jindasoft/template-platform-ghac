name: "Golang CI"
description: "Checkout, setup Go, test, and build"
inputs:
  ci_token:
    required: true
    description: "GitHub token for fetching private Go modules"

runs:
  using: "composite"
  steps:
    - name: Setup Golang
      uses: actions/setup-go@v7
      with:
        go-version: 1.27.x
        cache: false

    - name: Cache Go dependencies and build outputs
      uses: actions/cache@v5
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Config private repository
      env:
        CI_TOKEN: ${{ inputs.ci_token }}
      shell: bash
      run: |
        credentials_file="${RUNNER_TEMP}/golang-git-credentials"
        git_config_file="${RUNNER_TEMP}/golang-git-config"
        umask 077
        touch "$git_config_file"
        export GIT_CONFIG_GLOBAL="$git_config_file"
        git config --global credential.helper "store --file=${credentials_file}"
        printf 'protocol=https\nhost=github.com\nusername=x-access-token\npassword=%s\n\n' "$CI_TOKEN" | git credential approve
        echo "GIT_CONFIG_GLOBAL=$git_config_file" >> "$GITHUB_ENV"

    - name: Test Golang Code
      shell: bash
      env:
        GOPRIVATE: github.com/jindasoft/*
      run: go test -v ./...

    - name: Build
      shell: bash
      env:
        GOPRIVATE: github.com/jindasoft/*
      run: CGO_ENABLED=0 GOOS=linux go build -o ./out/goapp ./cmd/api/main.go

    - name: Cleanup private repository credentials
      if: ${{ always() }}
      shell: bash
      run: |
        rm -f "${RUNNER_TEMP}/golang-git-config"
        rm -f "${RUNNER_TEMP}/golang-git-credentials"
