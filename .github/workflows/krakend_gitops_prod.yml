name: KrakenD Reusable workflow (prod)

env:
  GCP_ARTIFACT_HOST: <REGION>-docker.pkg.dev

on:
  workflow_call:
    inputs:
      gitops_repo:
        required: true
        type: string
        description: "GitOps repository to deploy"
      artifact_registry:
        required: true
        type: string
        description: "GCP Artifact Registry for storing Docker images"
      environment_name:
        required: true
        type: string
        description: "Environment name for the KrakenD configuration"

    secrets:
      cd_token:
        required: true
        description: "GitHub token for deploying to the GitOps repository"
      gcp_workload_identity_provider:
        required: true
        description: "GCP Workload Identity Provider for pushing to Artifact Registry"
      gcp_service_account:
        required: true
        description: "GCP Service Account for pushing to Artifact Registry"

jobs:
  # ===========================================================
  # Config Check
  # ===========================================================
  config-check:
    uses: jindasoft/jinda-platform-ghac/.github/workflows/reusable_krakend_config_check.yml@main
    with:
      environment_name: ${{ inputs.environment_name }}

  # ===========================================================
  # CI task
  # ===========================================================
  gitops-ci:
    name: GitOps CI
    runs-on: ubuntu-24.04
    needs: config-check
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version_tag: ${{ steps.meta.outputs.version }}
    services:
      docker:
        image: docker:dind
        ports:
          - 2375:2375  # Expose Docker daemon port

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ secrets.gcp_workload_identity_provider }}'
          service_account: '${{ secrets.gcp_service_account }}'

      - name: Configure Docker for Google Container Registry
        run: gcloud auth configure-docker ${{ env.GCP_ARTIFACT_HOST }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GCP_ARTIFACT_HOST }}/${{ inputs.artifact_registry }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=tag,priority=300
            type=raw,value=latest,priority=200

      - name: Build Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ops
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ENV=${{ inputs.environment_name }}

      - name: Create KrakenD Trivy ignore file
        run: |
          printf '%s\n' \
            CVE-2026-56864 \
            CVE-2026-56865 \
            CVE-2026-84445 > .trivyignore.krakend

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.GCP_ARTIFACT_HOST }}/${{ inputs.artifact_registry }}/${{ github.event.repository.name }}:${{ steps.meta.outputs.version }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.krakend

      - name: Push Docker images
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "$IMAGE_TAGS"

  # ===========================================================
  # CD task
  # ===========================================================
  gitops-cd:
    needs: gitops-ci
    uses: jindasoft/jinda-platform-ghac/.github/workflows/reusable_gitops_cd.yml@main
    with:
      gitops_repo: ${{ inputs.gitops_repo }}
      version_tag: ${{ needs.gitops-ci.outputs.version_tag }}
    secrets:
      cd_token: ${{ secrets.cd_token }}
